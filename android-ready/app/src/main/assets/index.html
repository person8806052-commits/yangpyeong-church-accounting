<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="양평동교회 회계"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>양평동교회 회계 V4</title><style>
:root{--g:#176b3a;--l:#edf7f0;--r:#b3261e;--ink:#202124;--mut:#667085;--line:#dfe5e2;--bg:#f5f7f6}*{box-sizing:border-box}body{margin:0;padding-bottom:env(safe-area-inset-bottom);font-family:system-ui,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#104b2a,#1d7c45);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:9;box-shadow:0 2px 8px #0003}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.brand h1{font-size:18px;margin:0}.brand small{opacity:.85}.wrap{max-width:1200px;margin:auto;padding:14px}.quick,.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0}.quick button,.tabs button,.btn{min-height:42px;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}.quick button{background:var(--g);color:#fff;border-color:var(--g)}.tabs{position:sticky;top:68px;background:var(--bg);z-index:8;padding:10px 0}.tabs button.active{background:var(--g);color:#fff;border-color:var(--g)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.card b{font-size:22px;display:block;margin-top:6px}.muted{color:var(--mut);font-size:12px}.good{color:var(--g)}.bad{color:var(--r)}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:4px 0 10px}label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}textarea{min-height:70px}.form{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px}.form .wide{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.danger{background:#fff;color:var(--r);border-color:#efb6b1}.btn.warn{background:#fff7e6;border-color:#f0d398}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#f8faf9;position:sticky;top:0}.num{text-align:right;white-space:nowrap}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--l);color:var(--g);font-size:11px}.badge.exp{background:#fff0ef;color:var(--r)}.badge.pending{background:#fff7e6;color:#805a00}.badge.approved{background:var(--l);color:var(--g)}.hidden{display:none!important}.receipt{width:80px;height:80px;object-fit:cover;border:1px solid var(--line);border-radius:8px}.empty{padding:24px;text-align:center;color:var(--mut)}.approval{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:8px 0}.approval div{padding:7px;border-right:1px solid var(--line);min-height:42px}.approval div:last-child{border-right:0}.approval small{display:block;color:var(--mut)}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.sheet h2{position:sticky;top:-16px;background:#fff;padding:14px 0;z-index:1}.printOnly{display:none}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:span 2}.wrap{padding:10px}}@media print{header,.quick,.tabs,.no-print,.modal{display:none!important}.view{display:none!important}.view.print-target{display:block!important}.wrap{max-width:none;padding:0}.panel,.card{border:0;margin:0;padding:0;box-shadow:none}.printOnly{display:block}.tablewrap{overflow:visible}th{position:static}body{background:#fff}.approval{page-break-inside:avoid}}
</style></head><body>
<header><div class="brand"><img src="logo.jpg"><div><h1>양평동교회 회계 <small>V3</small></h1><small id="headSub">교회회계 실무관리</small></div></div></header><div id="platformHint" class="no-print" style="max-width:1200px;margin:8px auto 0;padding:0 14px"><div class="panel" style="margin:0;padding:9px 12px;font-size:12px">📱 <b>V4 통합형</b> · Android / iPhone / PC에서 동일한 회계자료를 사용할 수 있습니다. 기기 변경 전 <b>전체 백업</b>을 권장합니다.</div></div><main class="wrap">
<div class="quick no-print"><button onclick="openTx('수입')">＋ 수입입력</button><button onclick="openTx('지출')">＋ 지출입력</button><button onclick="openAccount()">＋ 관·항·목</button><button onclick="showView('reports')">결산/출력</button></div>
<nav class="tabs no-print"><button data-v="dash" onclick="showView('dash')" class="active">현황</button><button data-v="ledger" onclick="showView('ledger')">회계장부</button><button data-v="budget" onclick="showView('budget')">예산·계정</button><button data-v="receipts" onclick="showView('receipts')">영수증철</button><button data-v="reports" onclick="showView('reports')">결산서·출력</button><button data-v="settings" onclick="showView('settings')">설정</button></nav>
<section id="dash" class="view active"><h2>회계 현황</h2><div class="grid" id="dashCards"></div><div class="panel"><h3>최근 거래</h3><div id="recentTx"></div></div></section>
<section id="ledger" class="view"><div class="panel"><h2>회계장부</h2><div class="form no-print"><div><label>기간 시작</label><input type="date" id="fFrom"></div><div><label>기간 종료</label><input type="date" id="fTo"></div><div><label>구분</label><select id="fType"><option value="">전체</option><option>수입</option><option>지출</option></select></div><div><label>위원회/부서</label><select id="fDept"><option value="">전체</option></select></div></div><div class="actions no-print"><button class="btn primary" onclick="renderLedger()">조회</button><button class="btn" onclick="clearLedgerFilter()">초기화</button><button class="btn" onclick="printView('ledger')">장부 출력</button><button class="btn" onclick="exportCSV()">CSV(Excel) 저장</button></div><div class="tablewrap" id="ledgerTable"></div></div></section>
<section id="budget" class="view"><div class="panel"><h2>예산·계정 관리 <span class="muted">관 → 항 → 목 → 세부내용</span></h2><div class="actions no-print"><button class="btn primary" onclick="openAccount()">＋ 계정 추가</button><button class="btn" onclick="seedActualAccounts(false)">샘플 Excel 초기계정 다시 불러오기</button><button class="btn" onclick="printView('budget')">예산대비표 출력</button></div><div class="tablewrap" id="budgetTable"></div></div></section>
<section id="receipts" class="view"><div class="panel"><h2>영수증철</h2><div class="actions no-print"><button class="btn" onclick="printView('receipts')">영수증철 출력</button></div><div id="receiptList"></div></div></section>
<section id="reports" class="view"><div class="panel"><h2>결산서·출력물</h2><div id="reportArea"></div><div class="actions no-print"><button class="btn primary" onclick="printView('reports')">결산서 출력</button><button class="btn" onclick="printMonthly()">월계표 출력</button><button class="btn" onclick="printView('budget')">예산대비표 출력</button><button class="btn" onclick="printView('receipts')">영수증철 출력</button></div></div></section>
<section id="settings" class="view"><div class="panel"><h2>교회·부서·결재 설정</h2><div class="form"><div><label>교회명</label><input id="sChurch"></div><div><label>회계연도</label><input id="sYear" type="number"></div><div><label>위원회</label><select id="sCommittee" onchange="refreshDepartments()"></select></div><div><label>소속 부서</label><select id="sDepartment"></select></div><div><label>회계</label><input id="sAccounting"></div><div><label>부장</label><input id="sManager"></div><div><label>위원장</label><input id="sChair"></div><div><label>기초잔액</label><input id="sOpening" type="number" min="0"></div></div><div class="actions"><button class="btn primary" onclick="saveSettings()">설정 저장</button><button class="btn" onclick="backupJSON()">전체 백업</button><label class="btn">백업 복원<input class="hidden" type="file" accept="application/json" onchange="restoreJSON(event)"></label><button class="btn danger" onclick="resetAll()">전체 초기화</button></div><p class="muted">※ 사진 영수증과 장부는 이 기기 브라우저에 저장됩니다. 정기적으로 전체 백업을 권장합니다.</p></div></section>
</main>
<div id="txModal" class="modal"><div class="sheet"><h2 id="txTitle">거래 입력</h2><div class="form"><div><label>거래일</label><input id="txDate" type="date"></div><div><label>구분</label><select id="txType" onchange="refreshTxAccounts()"><option>수입</option><option>지출</option></select></div><div><label>위원회</label><select id="txCommittee" onchange="refreshTxDepartments()"></select></div><div><label>부서</label><select id="txDepartment"></select></div><div class="wide"><label>관 → 항 → 목 → 세부내용</label><select id="txAccount"></select></div><div><label>금액</label><input id="txAmount" type="number" min="0"></div><div class="wide"><label>거래내용</label><input id="txContent" placeholder="예: 교재 구입"></div><div><label>영수증 사진</label><input id="txReceipt" type="file" accept="image/*" capture="environment"></div><div><label>결재상태</label><select id="txApproval"><option value="작성">작성</option><option value="결재대기">결재대기</option><option value="결재완료">결재완료</option></select></div><div class="wide"><label>비고</label><textarea id="txNote"></textarea></div></div><div class="approval"><div><small>회계</small><b id="apAccounting">-</b></div><div><small>부장</small><b id="apManager">-</b></div><div><small>위원장</small><b id="apChair">-</b></div></div><div class="actions"><button class="btn primary" onclick="saveTx()">저장</button><button class="btn" onclick="closeModal('txModal')">취소</button></div></div></div>
<div id="accountModal" class="modal"><div class="sheet"><h2>관·항·목 계정</h2><div class="form"><div><label>수입/지출</label><select id="aType"><option>수입</option><option>지출</option></select></div><div><label>관</label><input id="aGwan"></div><div><label>항</label><input id="aHang"></div><div><label>목</label><input id="aMok"></div><div><label>세부내용</label><input id="aDetail"></div><div><label>예산액</label><input id="aBudget" type="number" min="0"></div><div class="wide"><label>산출근거</label><input id="aBasis"></div></div><div class="actions"><button class="btn primary" onclick="saveAccount()">저장</button><button class="btn" onclick="closeModal('accountModal')">취소</button></div></div></div>
<script>
const KEY='ypdc_accounting_v4';const OLD_KEY='ypdc_accounting_v3';
const ORG={
'행정위원회':['행정위원회'],'예배위원회':['안내1부','안내2부','음향부'],'선교위원회':['국내선교부','해외선교부','전도부','제직관리부','카페팀'],'교육위원회':['영유아부','유치부','유년부','소년부','중등부','고등부','청년부','장년부','어와나'],'음악위원회':['미가엘찬양대(1부)','가브리엘찬양대(2부)','누리에찬양대(3부)','에스더찬양대(수요)','에벤에셀중창단','크로스여성중창단','호산나남성중창단','예수미소선교단','주일예배찬양팀','워십찬양단'],'관리위원회':['건물관리','비품수리','차량부','서무부'],'친교위원회':['영빈부','교회식당 운영']};
let db={settings:{church:'양평동교회',year:new Date().getFullYear(),committee:'교육위원회',department:'장년부',accounting:'',manager:'',chair:'',opening:0},accounts:[],transactions:[],receipts:[]};let editTxId=null,editAccountId=null,receiptData=null;
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return '₩'+Number(n||0).toLocaleString('ko-KR')}function today(){return new Date().toISOString().slice(0,10)}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)raw=localStorage.getItem(OLD_KEY);const x=JSON.parse(raw||'null');if(x){db={...db,...x};localStorage.setItem(KEY,JSON.stringify(db))}}catch(e){console.warn(e)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function approvalHTML(){return `<div class="approval"><div><small>회계</small><b>${esc(db.settings.accounting||' ')}</b></div><div><small>부장</small><b>${esc(db.settings.manager||' ')}</b></div><div><small>위원장</small><b>${esc(db.settings.chair||' ')}</b></div></div>`}
function populateCommittee(elId,selected){const el=document.getElementById(elId);if(!el)return;el.innerHTML=Object.keys(ORG).map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}
function populateDepartment(elId,committee,selected,includeAll=false){const el=document.getElementById(elId);if(!el)return;let arr=ORG[committee]||[];el.innerHTML=(includeAll?'<option value="">전체</option>':'')+arr.map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}
function refreshDepartments(){populateDepartment('sDepartment',document.getElementById('sCommittee').value,db.settings.department)}function refreshTxDepartments(){populateDepartment('txDepartment',document.getElementById('txCommittee').value,db.settings.department)}
function sums(){let inc=db.transactions.filter(t=>t.type==='수입').reduce((s,t)=>s+Number(t.amount||0),0),exp=db.transactions.filter(t=>t.type==='지출').reduce((s,t)=>s+Number(t.amount||0),0);return {inc,exp,bal:Number(db.settings.opening||0)+inc-exp}}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));renderAll()}
function renderAll(){document.getElementById('headSub').textContent=`${db.settings.year}년 · ${db.settings.committee||'위원회'} · ${db.settings.department||'부서'}`;renderDash();renderLedger();renderBudget();renderReceipts();renderReports();renderSettings()}
function renderDash(){const s=sums(),budget=db.accounts.filter(a=>a.type==='지출').reduce((x,a)=>x+Number(a.budget||0),0),rate=budget?s.exp/budget*100:0;document.getElementById('dashCards').innerHTML=`<div class=card><span class=muted>총 수입</span><b class=good>${money(s.inc)}</b></div><div class=card><span class=muted>총 지출</span><b class=bad>${money(s.exp)}</b></div><div class=card><span class=muted>현재 잔액</span><b>${money(s.bal)}</b></div><div class=card><span class=muted>지출 예산 집행률</span><b>${rate.toFixed(1)}%</b></div>`;const r=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);document.getElementById('recentTx').innerHTML=txTable(r,false)||'<div class=empty>거래가 없습니다.</div>'}
function txTable(arr,actions=true){if(!arr.length)return '';return `<table><thead><tr><th>일자</th><th>구분</th><th>위원회/부서</th><th>관·항·목·세부</th><th>내용</th><th>금액</th><th>결재</th><th>영수증</th>${actions?'<th class=no-print>관리</th>':''}</tr></thead><tbody>${arr.map(t=>{const a=db.accounts.find(x=>x.id===t.accountId)||{};return `<tr><td>${esc(t.date)}</td><td><span class="badge ${t.type==='지출'?'exp':''}">${t.type}</span></td><td>${esc(t.committee||'')}<br>${esc(t.department||'')}</td><td>${esc([a.gwan,a.hang,a.mok,a.detail].filter(Boolean).join(' · '))}</td><td>${esc(t.content)}</td><td class=num>${money(t.amount)}</td><td><span class="badge ${t.approval==='결재완료'?'approved':'pending'}">${esc(t.approval||'작성')}</span></td><td>${t.receiptId?'첨부':'-'}</td>${actions?`<td class=no-print><button class=btn onclick="editTx('${t.id}')">수정</button> <button class='btn danger' onclick="delTx('${t.id}')">삭제</button></td>`:''}</tr>`}).join('')}</tbody></table>`}
function renderLedger(){const from=document.getElementById('fFrom')?.value||'',to=document.getElementById('fTo')?.value||'',type=document.getElementById('fType')?.value||'',dept=document.getElementById('fDept')?.value||'';let arr=[...db.transactions].filter(t=>(!from||t.date>=from)&&(!to||t.date<=to)&&(!type||t.type===type)&&(!dept||t.department===dept)).sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('ledgerTable').innerHTML=txTable(arr,true)||'<div class=empty>조건에 맞는 거래가 없습니다.</div>';const f=document.getElementById('fDept');if(f&&f.options.length<=1){f.innerHTML='<option value="">전체</option>'+Object.values(ORG).flat().map(x=>`<option>${x}</option>`).join('')}}
function clearLedgerFilter(){['fFrom','fTo','fType','fDept'].forEach(id=>{let e=document.getElementById(id);if(e)e.value='' });renderLedger()}
function used(a){return db.transactions.filter(t=>t.accountId===a.id&&t.type===a.type).reduce((s,t)=>s+Number(t.amount||0),0)}
function renderBudget(){let rows=db.accounts.map(a=>{let u=used(a),bal=Number(a.budget||0)-u,rate=a.budget?u/a.budget*100:0;return `<tr><td>${a.type}</td><td>${esc(a.gwan)}</td><td>${esc(a.hang)}</td><td>${esc(a.mok)}</td><td>${esc(a.detail)}</td><td class=num>${money(a.budget)}</td><td class=num>${money(u)}</td><td class=num>${money(bal)}</td><td>${rate.toFixed(1)}%</td><td>${esc(a.basis||'')}</td><td class=no-print><button class=btn onclick="openAccount('${a.id}')">수정</button> <button class='btn danger' onclick="delAccount('${a.id}')">삭제</button></td></tr>`}).join('');document.getElementById('budgetTable').innerHTML=rows?`<table><thead><tr><th>구분</th><th>관</th><th>항</th><th>목</th><th>세부내용</th><th>예산액</th><th>집행액</th><th>잔액</th><th>집행률</th><th>산출근거</th><th class=no-print>관리</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class=empty>계정이 없습니다.</div>'}
function renderReceipts(){let rs=[...db.receipts].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('receiptList').innerHTML=rs.length?`<div class=tablewrap><table><thead><tr><th>번호</th><th>일자</th><th>거래내용</th><th>금액</th><th>영수증</th><th class=no-print>관리</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${rs.length-i}</td><td>${esc(r.date)}</td><td>${esc(r.content)}</td><td class=num>${money(r.amount)}</td><td><a href="${r.data}" target="_blank"><img class=receipt src="${r.data}"></a></td><td class=no-print><button class='btn danger' onclick="delReceipt('${r.id}')">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<div class=empty>첨부된 영수증이 없습니다.</div>'}
function renderReports(){const s=sums(),year=db.settings.year,by=db.accounts.filter(a=>a.budget||used(a)).map(a=>({...a,u:used(a)}));document.getElementById('reportArea').innerHTML=`<div class=printOnly><h1>${esc(db.settings.church)} ${year}년도 회계 결산서</h1></div><h3>${esc(db.settings.committee||'')} ${esc(db.settings.department||'')}</h3>${approvalHTML()}<div class=grid><div class=card><span class=muted>수입액</span><b>${money(s.inc)}</b></div><div class=card><span class=muted>지출액</span><b>${money(s.exp)}</b></div><div class=card><span class=muted>잔액</span><b>${money(s.bal)}</b></div></div><div class=tablewrap><table><thead><tr><th>구분</th><th>관</th><th>항</th><th>목</th><th>세부내용</th><th>예산액</th><th>수입/집행액</th><th>잔액</th></tr></thead><tbody>${by.map(a=>`<tr><td>${a.type}</td><td>${esc(a.gwan)}</td><td>${esc(a.hang)}</td><td>${esc(a.mok)}</td><td>${esc(a.detail)}</td><td class=num>${money(a.budget)}</td><td class=num>${money(a.u)}</td><td class=num>${money(Number(a.budget||0)-a.u)}</td></tr>`).join('')}</tbody></table></div>`}
function renderSettings(){for(const [id,val] of Object.entries({sChurch:db.settings.church,sYear:db.settings.year,sAccounting:db.settings.accounting,sManager:db.settings.manager,sChair:db.settings.chair,sOpening:db.settings.opening})){let e=document.getElementById(id);if(e)e.value=val??''}populateCommittee('sCommittee',db.settings.committee);populateDepartment('sDepartment',db.settings.committee,db.settings.department)}
function openTx(type='지출',id=null){editTxId=id;receiptData=null;let t=id?db.transactions.find(x=>x.id===id):null;document.getElementById('txTitle').textContent=t?'거래 수정':'거래 입력';document.getElementById('txDate').value=t?.date||today();document.getElementById('txType').value=t?.type||type;populateCommittee('txCommittee',t?.committee||db.settings.committee);populateDepartment('txDepartment',t?.committee||db.settings.committee,t?.department||db.settings.department);document.getElementById('txAmount').value=t?.amount||'';document.getElementById('txContent').value=t?.content||'';document.getElementById('txNote').value=t?.note||'';document.getElementById('txApproval').value=t?.approval||'작성';document.getElementById('apAccounting').textContent=db.settings.accounting||'-';document.getElementById('apManager').textContent=db.settings.manager||'-';document.getElementById('apChair').textContent=db.settings.chair||'-';refreshTxAccounts(t?.accountId);document.getElementById('txModal').classList.add('show')}
function refreshTxAccounts(selected){let type=document.getElementById('txType').value,el=document.getElementById('txAccount');let arr=db.accounts.filter(a=>a.type===type);el.innerHTML=arr.map(a=>`<option value="${a.id}">${esc([a.gwan,a.hang,a.mok,a.detail].filter(Boolean).join(' → '))}</option>`).join('')||'<option value="">먼저 계정을 추가하세요</option>';if(selected)el.value=selected}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function saveTx(){let aid=document.getElementById('txAccount').value,a=db.accounts.find(x=>x.id===aid);if(!a){alert('관·항·목 계정을 먼저 선택하세요.');return}let file=document.getElementById('txReceipt').files[0];if(file)receiptData=await fileToDataURL(file);let d={id:editTxId||uid('tx'),date:document.getElementById('txDate').value,type:document.getElementById('txType').value,committee:document.getElementById('txCommittee').value,department:document.getElementById('txDepartment').value,accountId:aid,amount:Number(document.getElementById('txAmount').value||0),content:document.getElementById('txContent').value.trim(),note:document.getElementById('txNote').value.trim(),approval:document.getElementById('txApproval').value,receiptId:null};if(!d.date||!d.amount||!d.content){alert('거래일·금액·거래내용을 입력하세요.');return}let old=editTxId?db.transactions.find(x=>x.id===editTxId):null;if(old)d.receiptId=old.receiptId;if(receiptData){let rid=uid('rc');d.receiptId=rid;db.receipts=db.receipts.filter(r=>r.id!==old?.receiptId);db.receipts.push({id:rid,date:d.date,content:d.content,amount:d.amount,data:receiptData})}if(editTxId)db.transactions=db.transactions.map(x=>x.id===editTxId?d:x);else db.transactions.push(d);closeModal('txModal');save()}
function editTx(id){openTx('',id)}function delTx(id){if(!confirm('이 거래를 삭제할까요?'))return;let t=db.transactions.find(x=>x.id===id);db.transactions=db.transactions.filter(x=>x.id!==id);if(t?.receiptId)db.receipts=db.receipts.filter(r=>r.id!==t.receiptId);save()}
function openAccount(id=null){editAccountId=id;let a=id?db.accounts.find(x=>x.id===id):{};for(const [id,val] of Object.entries({aType:a?.type||'지출',aGwan:a?.gwan||'',aHang:a?.hang||'',aMok:a?.mok||'',aDetail:a?.detail||'',aBudget:a?.budget||0,aBasis:a?.basis||''})){document.getElementById(id).value=val}document.getElementById('accountModal').classList.add('show')}
function saveAccount(){let d={id:editAccountId||uid('acc'),type:aType.value,gwan:aGwan.value.trim(),hang:aHang.value.trim(),mok:aMok.value.trim(),detail:aDetail.value.trim(),budget:Number(aBudget.value||0),basis:aBasis.value.trim()};if(!d.gwan||!d.hang||!d.mok){alert('관·항·목은 필수입니다.');return}if(editAccountId)db.accounts=db.accounts.map(x=>x.id===editAccountId?d:x);else db.accounts.push(d);closeModal('accountModal');save()}
function delAccount(id){if(db.transactions.some(t=>t.accountId===id)){alert('거래가 연결된 계정은 삭제할 수 없습니다.');return}if(confirm('계정을 삭제할까요?')){db.accounts=db.accounts.filter(x=>x.id!==id);save()}}
function seedActualAccounts(silent=false){const rows=[['수입','수입','이월금','이월금','전기이월금',0,'첨부 샘플 Excel 실제 구조'],['수입','수입','교회예산','교회예산','교회예산',0,'첨부 샘플 Excel 실제 구조'],['수입','수입','기타','기타','기타수입',0,'첨부 샘플 Excel 실제 구조'],['지출','지출','운영비','운영비','세부항목 미지정 1',0,'원본 세부항목 공란'],['지출','지출','운영비','운영비','세부항목 미지정 2',0,'원본 세부항목 공란'],['지출','지출','행사비','행사비','세부항목 미지정 1',0,'원본 세부항목 공란'],['지출','지출','행사비','행사비','세부항목 미지정 2',0,'원본 세부항목 공란'],['지출','지출','예비비','예비비','예비비',0,'첨부 샘플 Excel 실제 구조']];for(const r of rows){if(!db.accounts.some(a=>a.type===r[0]&&a.gwan===r[1]&&a.hang===r[2]&&a.mok===r[3]&&a.detail===r[4]))db.accounts.push({id:uid('acc'),type:r[0],gwan:r[1],hang:r[2],mok:r[3],detail:r[4],budget:r[5],basis:r[6],source:'sample-excel'})}save();if(!silent)alert('첨부 샘플 Excel의 실제 초기 계정 구조를 불러왔습니다. 원본에서 비어 있던 세부항목은 임의 명칭을 만들지 않고 “세부항목 미지정”으로 표시했습니다.')}
function saveSettings(){db.settings={...db.settings,church:sChurch.value||'양평동교회',year:Number(sYear.value)||new Date().getFullYear(),committee:sCommittee.value,department:sDepartment.value,accounting:sAccounting.value,manager:sManager.value,chair:sChair.value,opening:Number(sOpening.value||0)};save();alert('설정이 저장되었습니다.')}
function closeModal(id){document.getElementById(id).classList.remove('show');document.getElementById('txReceipt').value='';receiptData=null}function delReceipt(id){if(!confirm('영수증 사진을 삭제할까요?'))return;db.receipts=db.receipts.filter(r=>r.id!==id);db.transactions=db.transactions.map(t=>t.receiptId===id?{...t,receiptId:null}:t);save()}
function printView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('print-target'));document.getElementById(v).classList.add('print-target');window.print();setTimeout(()=>document.getElementById(v).classList.remove('print-target'),500)}function printMonthly(){let m=prompt('출력할 월을 입력하세요 (1~12)');if(!m)return;let mm=String(m).padStart(2,'0');let oldFrom=fFrom.value,oldTo=fTo.value;fFrom.value=`${db.settings.year}-${mm}-01`;fTo.value=new Date(db.settings.year,Number(m),0).toISOString().slice(0,10);renderLedger();printView('ledger');setTimeout(()=>{fFrom.value=oldFrom;fTo.value=oldTo;renderLedger()},600)}
function exportCSV(){let rows=[['날짜','구분','위원회','부서','관','항','목','세부내용','거래내용','금액','결재상태','비고']];db.transactions.forEach(t=>{let a=db.accounts.find(x=>x.id===t.accountId)||{};rows.push([t.date,t.type,t.committee,t.department,a.gwan,a.hang,a.mok,a.detail,t.content,t.amount,t.approval,t.note])});let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`양평동교회_회계장부_${db.settings.year}.csv`)}function backupJSON(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),`양평동교회_회계V3_백업_${db.settings.year}.json`)}function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.accounts)||!Array.isArray(x.transactions))throw Error();db=x;save();alert('복원되었습니다.')}catch(_){alert('백업 파일 형식이 올바르지 않습니다.')}};r.readAsText(f)}function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetAll(){if(confirm('모든 장부·예산·영수증을 삭제합니다.')){localStorage.removeItem(KEY);location.reload()}}
load();if(!db.accounts.length)seedActualAccounts(true);renderAll();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
